<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplSpend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>SimplSpend</h1>
        <p>Track your money. Understanding your spending.</p>
        
        <div class="setup" id="setup">
            <h2>Let's set up SimplSpend</h2>

            <label for="starting-money">How much money do you have?</label>
            <input
                type="number"
                id="starting-money"
                placeholder="Enter Amount"
            >

            <label for="next-payment">When is your next payment?</label>
            <input
                type="date"
                id="next-payment"
            >

            <button id="setup-btn">Coninue</button>
        </div>

        <div class="card">
            <h3>Total Spent</h3>
            <h2 id="total-spent">₹0</h2>
        </div>
        
        <div class="card">
            <h3>Money Left</h3>
            <h2 id="money-left">₹0</h2>
        </div>

        <div class="card">
            <h3>Days until the next payment</h3>
            <h2 id="days-left">0</h2>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <h2 id="total-expenses">0</h2>
        </div>

        <div class="add-expense">
            <h2>Add Expense</h2>
            <form id="expense-form">
            <label for="description">Description</label>
            <input
                type="text"
                id="description"
                placeholder="What did you spend on?"
            >
            <label for="amount">Amount</label>
            <input 
                type="number"
                id="amount"
                placeholder="How much did you spend?"
            >
            <label for="category">Category</label>
            <select id="category">
                <option value="">Select a category</option>
                    <option value="food">Food</option>
                    <option value="travel">Travel</option>
                    <option value="shopping">Shopping</option>
                    <option value="bills">Bills</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="other">Other</option>
            </select>
            <label for="date">Date</label>
            <input 
                type="date"
                id="date"
            >

            <button id="add-expense-btn">Add Expense</button>
            </form>
        </div>

        <div class="expenses">
            <h2>Recent Expenses</h2>

            <div id="expense-list">
                
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
