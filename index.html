<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplSpend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

    <header class="topbar">
        <h1>SimplSpend</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="history.html">History</a>
    </nav>
        </header>
        
        <div class="setup" id="setup">
            <h2>Let's set up SimplSpend</h2>

            <label for="starting-money">How much money do you have?</label>
            <input
                type="number"
                id="starting-money"
                placeholder="Enter Amount"
            >

            <label for="next-payment">When is your next payment?</label>
            <input
                type="date"
                id="next-payment"
            >

            <button id="setup-btn">Continue</button>
        </div>

        <main class="home-hero">

    <p class="eyebrow">Total Spent</p>

    <h2 id="total-spent">₹0</h2>

    <div class="money-status">
        <span id="money-left">₹0</span>
        <span>left</span>

        <span class="separator">•</span>

        <span id="days-left">0</span>
        <span>days until payment</span>
    </div>

    <button id="open-expense-btn">+ Add Expense</button>

</main>

    <div class="add-expense" id="expense-modal">
        <div class="expense-modal-content">
            <button id="close-expense-btn">×</button>
            <h2>Add Expense</h2>

            <form id="expense-form">

                <label for="description">Description</label>
                <input 
                    type="text"
                    id="description"
                    placeholder="What did you spend on?"
                >
                <label for="amount">Amount</label>
                <input 
                    type="number"
                    id="amount"
                    placeholder="How much did you spend?"
                >
                <label for="category">Category</label>
                <select id="category">
                    <option value="">Select a category</option>
                    <option value="food">Food</option>
                    <option value="travel">Travel</option>
                    <option value="shopping">Shopping</option>
                    <option value="bills">Bills</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="other">Other</option>
                </select>
                <label for="date">Date</label>
                <input 
                    type="date"
                    id="date"
                >
            <button id="add-expense-btn">Add Expense</button>

            </form>

        </div>

    </div>
    
        <div class="expenses">
            <h2>Recent Expenses</h2>

            <div id="expense-list">
                
            </div>
        </div>

    </div>
    <div id="toast" class="toast">Expense added ✓</div>
    <script src="script.js"></script>
</body>
</html>
